# ALSA namespace for the Spotify client ONLY, selected via ALSA_CONFIG_PATH.
#
# spotify-player cannot name an output device: it calls audio_backend::find(None)
# and then backend(None, ...), and librespot's ALSA backend maps that None to
# the literal string "default". So the device has to be chosen by defining what
# "default" MEANS for that process, rather than by configuring the client.
#
# Nothing here touches the system default or the pi desktop session. Deleting
# the file reverts it.
#
# The sink is named, never numbered: card "V3" is the Creative Pebble V3.
# plughw:4,0 would be correct today only by luck of probe order, and issue #38
# exists because that luck is not a design.

# Base definitions, so the plug/hw plugin types resolve at all.
</usr/share/alsa/alsa.conf>

pcm.pebble {
    type hw
    card "V3"
    device 0
}

# "default" is the Pebble's playback endpoint. plug handles rate and format
# conversion, since the Pebble accepts 48 kHz stereo and a client may offer
# something else.
pcm.!default {
    type plug
    slave.pcm "pebble"
}

ctl.!default {
    type hw
    card "V3"
}
