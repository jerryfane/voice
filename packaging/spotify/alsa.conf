# ALSA namespace for the Spotify client ONLY, selected via ALSA_CONFIG_PATH.
#
# spotify-player cannot name an output device: it calls audio_backend::find(None)
# and then backend(None, ...), and librespot's ALSA backend maps that None to
# the literal string "default". So the device has to be chosen by defining what
# "default" MEANS for that process, rather than by configuring the client.
#
# DELIBERATELY SELF-CONTAINED: this file does NOT include
# /usr/share/alsa/alsa.conf.
#
# The first version did, and was decorative. That file ends with an @hooks
# section loading /etc/alsa/conf.d/*, ALSA runs hooks AFTER the root config is
# parsed, and the PulseAudio/PipeWire file dropped there redefines
# pcm.!default - so an override written before the hooks fire is replaced by
# one written after. Playback worked, out of whatever the desktop stack chose,
# and the pin below was never consulted. Measured on the device: with the
# include, playback against a config naming a NONEXISTENT card still
# succeeded. Without it:
#
#   bogus card -> aplay: audio open error: No such device, exit 1
#   real card  -> exit 0, audible from the Pebble
#
# hw and plug are built into libasound, so nothing here needs the base config,
# and dropping it means nothing loaded later can override this default.
#
# The sink is named, never numbered: card "V3" is the Creative Pebble V3.
# plughw:4,0 would be correct today only by luck of probe order, and issue #38
# exists because that luck is not a design.

pcm.!default {
    type plug
    slave.pcm {
        type hw
        card "V3"
        device 0
    }
}

ctl.!default {
    type hw
    card "V3"
}
