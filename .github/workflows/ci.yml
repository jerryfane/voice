name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: Static binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/voice-amd64 ./cmd/voice
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/voice-arm64 ./cmd/voice
