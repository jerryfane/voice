name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      # Type-aware unhandled-error check. Run with `go run pkg@version` so it
      # never enters go.mod and never reaches the shipped binary, which keeps
      # the single static CGO_ENABLED=0 build intact.
      #
      # -blank is on and there is NO exclude file, on purpose. Four rounds of
      # review each enumerated a shape or a name, and the next real defect
      # arrived in the gap every time: assignment-only missed bare calls, then
      # those missed defer, then the name list missed three json.Marshal
      # discards that would have told the model a device did not exist. The
      # invariant that ends that pattern is not a better list - it is that
      # production discards nothing, which is checkable without enumerating
      # anything. A type-level exclude file would silence the next real case
      # at that type, so there is none.
      #
      # Tests are skipped here; internal/codecheck covers the test tree, and
      # its comment stays honest that it is name-scoped rather than complete.
      - name: Unhandled errors (errcheck, CI only)
        run: go run github.com/kisielk/errcheck@v1.9.0 -ignoretests -blank ./...
      - name: Static binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/voice-amd64 ./cmd/voice
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/voice-arm64 ./cmd/voice
