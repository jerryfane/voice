name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - run: go test ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: Static binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/herdr-amd64 ./cmd/herdr
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/herdr-arm64 ./cmd/herdr
